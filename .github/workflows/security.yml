name: Security Scans

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
  pull_request:
    branches:
      - main
      - develop
      - 'feat/**'
  schedule:
    - cron: '0 2 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync Python dependencies
        run: uv sync --dev --frozen

      - name: Apply patched dependencies
        run: |
          uv pip install --no-deps "starlette==0.47.2"

      - name: Install pip-audit
        run: uv pip install pip-audit

      # Temporary skip for GHSA-4xh5-x5gv-qwph until upstream pip publishes a patched release.
      - name: Python dependency audit
        run: uv run pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        working-directory: dlsite_classification_web
        run: yarn install --frozen-lockfile

      - name: Yarn vulnerability audit
        working-directory: dlsite_classification_web
        run: yarn audit --level moderate
