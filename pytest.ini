[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings
addopts = -ra

# Logging
log_cli = false
log_cli_level = INFO

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that are slow to run
